name: poker_timer
description: A professional poker tournament blind timer app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.2
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Audio
  audioplayers: ^6.0.0
  # Keep screen awake
  wakelock_plus: ^1.2.8
  # File sharing / picking
  share_plus: ^10.0.3
  file_picker: ^8.1.2
  # Path utilities
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
